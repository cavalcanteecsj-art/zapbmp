services:
  - type: web
    name: sla-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        value: https://SEU-FRONT.vercel.app
      - key: SLA_TARGET_SECONDS
        value: 300

